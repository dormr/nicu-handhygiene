<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NICU 손위생 시뮬레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 3D stage on the left with game-style overlays, step list on the right; one visual world (bright toy room), single theme */
:root{
  --bg:#dfe9f5;
  --panel:#ffffff;
  --ink:#1b2440;
  --muted:#5d6883;
  --line:#c9d4e4;
  --accent:#2f5bd3;
  --zone:#3cae4b;
  --m1:#2563c9; --m1-bg:#e3ecfb;
  --m2:#7a3fc4; --m2-bg:#efe6fb;
  --m3:#d0480f; --m3-bg:#fdebe1;
  --m4:#0f7c7a; --m4-bg:#ddf3f2;
  --m5:#6b5a00; --m5-bg:#fbf1c4;
  --display:"Jua","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1360px;margin:0 auto;padding:18px 16px 32px;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:30px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13.5px;margin:2px 0 0}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:inherit;font-family:var(--display);font-size:16px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:10px;padding:5px 12px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.tab:hover{transform:translateY(-1px)}
.tab:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--ink)}
button:focus-visible{outline:3px solid #ffb703;outline-offset:2px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:1fr}}

.stage{position:relative;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:#bcd3ee;aspect-ratio:16/10;min-height:340px;box-shadow:0 5px 0 var(--ink)}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.ov{position:absolute;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);font-family:var(--display);font-size:13px;color:var(--ink);background:rgba(255,255,255,.88);border:2px solid var(--ink);border-radius:7px;padding:0 6px;white-space:nowrap}
.lbl.zone{background:var(--zone);color:#fff}
.bubble{position:absolute;transform:translate(-50%,-100%);max-width:260px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:13.5px;font-weight:500;text-align:center;box-shadow:0 3px 0 var(--ink);text-wrap:balance}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:12px;height:12px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.badge{top:14px;left:50%;transform:translateX(-50%) scale(.8);opacity:0;transition:opacity .2s,transform .2s;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 14px 10px;text-align:center;box-shadow:0 4px 0 var(--ink);display:grid;gap:6px;justify-items:center}
.badge.on{opacity:1;transform:translateX(-50%) scale(1)}
.bstep{font-family:var(--display);font-size:17px;color:var(--ink);background:#fff4c2;border-radius:8px;padding:2px 10px;min-height:1.4em}
.badge b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--accent);display:flex;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:2px 10px 2px 3px;border-radius:999px;background:var(--cbg);color:var(--c)}
.chip i{font-style:normal;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-size:11.5px}
.zonechip{top:12px;left:12px;font-family:var(--display);font-size:15px;padding:3px 10px;border-radius:9px;border:2.5px solid var(--ink);background:#fff;color:var(--muted)}
.zonechip.in{background:var(--zone);color:#fff}
.ppe{top:12px;right:12px;display:flex;gap:6px}
.ppe span{font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:8px;border:2px solid var(--ink);background:#fff;color:#9aa3b5}
.ppe span.on{color:var(--ink);background:#ffe27a}
.hint{bottom:10px;right:12px;font-size:12px;color:#33405e;background:rgba(255,255,255,.7);padding:1px 8px;border-radius:6px}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.btn{font:inherit;font-family:var(--display);font-size:16px;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:10px;padding:5px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:#ffb703}
.progress{flex:1;min-width:140px;height:12px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.progress div{height:100%;width:0;background:var(--accent);transition:width .3s}
.speed{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted)}
.speed button{font:inherit;font-size:12.5px;font-weight:700;border:2px solid var(--ink);background:#fff;border-radius:7px;padding:1px 7px;cursor:pointer}
.speed button[aria-pressed="true"]{background:var(--ink);color:#fff}

.side{background:var(--panel);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:14px;display:grid;gap:10px}
.side h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0}
.side .meta{font-size:12.5px;color:var(--muted);margin:-6px 0 0}
.note{font-size:12.5px;background:#fff6d6;border:1.5px solid #e8c95b;border-radius:8px;padding:5px 8px}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:5px;max-height:560px;overflow:auto}
ol.steps button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;padding:6px 8px;border-radius:9px;border:2px solid transparent;cursor:pointer;font-size:13.5px}
ol.steps button:hover{background:#f0f4fb}
ol.steps button:focus-visible{outline:3px solid #ffb703}
ol.steps li.cur button{border-color:var(--ink);background:#fff4c2}
ol.steps li.done button{color:var(--muted)}
.num{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-family:var(--display);font-size:13px;background:#e7edf6;border:1.5px solid var(--line)}
li.hh .num{background:var(--accent);color:#fff;border-color:var(--accent)}
.stxt{display:grid;gap:3px}
.stxt .chips{justify-content:flex-start}
.stxt .chip{font-size:11.5px;padding:0 8px 0 2px}
.stxt .chip i{width:16px;height:16px;font-size:10px}
.zt{font-size:11px;font-weight:700;color:var(--zone)}
.zt.out{color:#8a93a6}
.warn{font-size:11.5px;color:var(--m3)}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.legend .chip{font-size:12px}
footer{font-size:12px;color:var(--muted)}
footer.copy{text-align:center;padding-top:6px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>NICU 손위생 시뮬레이션</h1>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </header>

  <div class="main">
    <section>
      <div class="stage" id="stage">
        <canvas id="c" aria-label="NICU 3D 장면"></canvas>
        <div class="ov" id="labels" style="inset:0"></div>
        <div class="ov bubble" id="bubble"></div>
        <div class="ov zonechip" id="zonechip">신생아영역 밖</div>
        <div class="ov ppe"><span id="pGown">가운</span><span id="pGlove">장갑</span></div>
        <div class="ov badge" id="badge"><b><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V6a1.5 1.5 0 0 1 3 0v4"/><path d="M10 10V4.5a1.5 1.5 0 0 1 3 0V10"/><path d="M13 10V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M16 11V8.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-.5A6.5 6.5 0 0 1 6 18l-2.6-4.3a1.5 1.5 0 0 1 2.5-1.6L7 13.5"/></svg>손위생!</b><div class="chips" id="badgeChips"></div></div>
        <div class="ov hint">드래그: 회전 · 휠: 확대/축소</div>
      </div>
      <div class="controls">
        <button class="btn" id="prev" type="button">◀ 이전</button>
        <button class="btn primary" id="play" type="button">❚❚ 일시정지</button>
        <button class="btn" id="next" type="button">다음 ▶</button>
        <button class="btn" id="restart" type="button">↺ 처음부터</button>
        <div class="progress" aria-hidden="true"><div id="bar"></div></div>
        <div class="speed">속도 <button type="button" data-s="0.75">0.75×</button><button type="button" data-s="1" aria-pressed="true">1×</button><button type="button" data-s="1.6">1.6×</button></div>
      </div>
    </section>

    <aside class="side">
      <h2 id="caseTitle">CASE 1</h2>
      <p class="meta" id="caseMeta"></p>
      <div class="note" id="caseNote" hidden></div>
      <ol class="steps" id="steps"></ol>
      <div class="legend">
        <span class="chip" style="--c:var(--m1);--cbg:var(--m1-bg)"><i>1</i>환자 접촉 전</span>
        <span class="chip" style="--c:var(--m2);--cbg:var(--m2-bg)"><i>2</i>청결/무균 처치 전</span>
        <span class="chip" style="--c:var(--m3);--cbg:var(--m3-bg)"><i>3</i>체액 노출 위험 행위 후</span>
        <span class="chip" style="--c:var(--m4);--cbg:var(--m4-bg)"><i>4</i>환자 접촉 후</span>
        <span class="chip" style="--c:var(--m5);--cbg:var(--m5-bg)"><i>5</i>환자 주변 환경 접촉 후</span>
      </div>
    </aside>
  </div>
  <footer class="copy">ⓒ순천향대학교부속부천병원감염관리팀.2026</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const MOM = {1:"환자 접촉 전",2:"청결/무균 처치 전",3:"체액 노출 위험 행위 후",4:"환자 접촉 후",5:"환자 주변 환경 접촉 후"};
const mv = n => `--c:var(--m${n});--cbg:var(--m${n}-bg)`;
const chipHTML = m => m.map(n=>`<span class="chip" style="${mv(n)}"><i>${n}</i>${MOM[n]}</span>`).join("");
const ZONE_R = 2.8;

// ---------- stations (x, z, facing) ----------
const ST = {
  start:  {x:0,    z:4.6, f:Math.PI},
  bed:    {x:0,    z:2.0, f:Math.PI},
  suction:{x:-1.75,z:-0.2,f:Math.PI},
  trash:  {x:1.5,  z:1.85,f:Math.PI/2},
  hub:    {x:1.85, z:1.55,f:Math.PI},
  table:  {x:3.6,  z:0.45,f:Math.PI},
  med:    {x:5.95, z:0.4, f:Math.PI},
  scale:  {x:6.0,  z:3.35,f:Math.PI},
  sink:   {x:-3.88,z:-0.22,f:Math.PI}
};
const inZone = s => Math.hypot(ST[s].x, ST[s].z) < ZONE_R;

// ---------- case data ----------
const hh = (at,m) => ({act:"hh", at, m});
const CASES = [
 {no:1,title:"단순접촉",steps:[
  hh("bed",[1]),
  {act:"ppe",at:"bed",t:"가운, 장갑 착용",gown:true,glove:"clean"},
  {act:"door",at:"bed",t:"보육기 문 열기",door:true},
  {act:"reach",at:"bed",t:"환자 단순 접촉"},
  {act:"door",at:"bed",t:"보육기 문 닫기",door:false},
  {act:"ppe",at:"bed",t:"가운, 장갑 제거",gown:false,glove:"none"},
  hh("bed",[4])]},
 {no:2,title:"기저귀 교환",steps:[
  hh("bed",[1]),
  {act:"ppe",at:"bed",t:"가운, 장갑 착용",gown:true,glove:"clean"},
  {act:"door",at:"bed",t:"보육기 문 열기",door:true},
  {act:"reach",at:"bed",t:"환자 단순 접촉 (V/S 등)"},
  {act:"reach",at:"bed",t:"기저귀 제거 후, 비닐 장갑을 뒤집어 벗으며 기저귀 넣기",hold:"diaper"},
  {act:"weigh",at:"scale",t:"(신생아영역을 벗어남) 기저귀 무게 측정",warn:"저울 외의 환경과 접촉하지 않도록 주의"},
  {act:"dispose",at:"trash",t:"기저귀 폐기",hold:null},
  {act:"ppe",at:"bed",t:"가운, 장갑 제거",gown:false,glove:"none"},
  {act:"hh",at:"sink",m:[3,4],wash:true}]},
 {no:3,title:"Suction",steps:[
  hh("bed",[2,1]),
  {act:"work",at:"suction",t:"N/S 준비, Suction catheter 개봉, 흡인 압력 설정",prop:"tube"},
  {act:"ppe",at:"bed",t:"가운 착용",gown:true},
  {act:"door",at:"bed",t:"보육기 문 열기",door:true},
  hh("bed",[2]),
  {act:"ppe",at:"bed",t:"장갑 착용",glove:"clean"},
  {act:"reach",at:"bed",t:"Catheter–Suction line 연결, Suction 시행",prop:"tube"},
  {act:"ppe",at:"bed",t:"Suction catheter와 장갑 제거",glove:"none"},
  {act:"ppe",at:"bed",t:"가운 제거",gown:false},
  hh("bed",[3,4])]},
 {no:4,title:"IV insertion 및 채혈",steps:[
  hh("table",[2]),
  {act:"work",at:"table",t:"처치대에서 IV, 채혈 물품 준비",prop:"syringe"},
  hh("bed",[1]),
  {act:"ppe",at:"bed",t:"가운 착용",gown:true},
  {act:"door",at:"bed",t:"보육기 문 열기",door:true},
  hh("bed",[2]),
  {act:"ppe",at:"bed",t:"장갑 착용",glove:"clean"},
  {act:"reach",at:"bed",t:"IV insertion 및 채혈",prop:"syringe"},
  {act:"ppe",at:"bed",t:"가운, 장갑 제거",gown:false,glove:"none"},
  hh("bed",[3,4]),
  {act:"work",at:"table",t:"처치대에서 검체 등 정리",prop:"specimen"},
  hh("table",[3])]},
 {no:5,title:"Dressing",steps:[
  hh("table",[2]),
  {act:"work",at:"table",t:"처치대에서 Dressing 재료 준비",prop:"gauze"},
  hh("bed",[1]),
  {act:"ppe",at:"bed",t:"가운 착용",gown:true},
  {act:"door",at:"bed",t:"보육기 문 열기",door:true},
  hh("bed",[2]),
  {act:"ppe",at:"bed",t:"청결장갑 착용",glove:"clean"},
  {act:"reach",at:"bed",t:"기존 드레싱 제거",prop:"gauze"},
  {act:"ppe",at:"bed",t:"장갑 제거",glove:"none"},
  hh("bed",[3,2]),
  {act:"ppe",at:"bed",t:"멸균 장갑 착용",glove:"sterile"},
  {act:"reach",at:"bed",t:"드레싱 시행",prop:"gauze"},
  {act:"ppe",at:"bed",t:"가운, 장갑 제거",gown:false,glove:"none"},
  hh("bed",[3])]},
 {no:6,title:"투약",note:"C-line hub가 인큐베이터 밖에 있는 상황",steps:[
  hh("med",[2]),
  {act:"work",at:"med",t:"의약품 준비구역(조제대)에서 약물 준비",prop:"syringe"},
  hh("hub",[2]),
  {act:"work",at:"hub",t:"Scrub the hub / 투약",prop:"syringe"},
  hh("hub",[3,5])]}
];
CASES.forEach(c=>c.steps.forEach(s=>{ if(s.act==="hh") s.t="손위생"; }));

// ---------- three.js scene ----------
const canvas = document.getElementById("c");
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcd3ee);
const camera = new THREE.PerspectiveCamera(38, 1.6, 0.1, 100);
const target = new THREE.Vector3(0.6,1.1,0.4);
let camTheta = 0.3, camPhi = 0.98, camR = 13;
function placeCam(){
  camera.position.set(target.x + camR*Math.sin(camPhi)*Math.sin(camTheta), target.y + camR*Math.cos(camPhi), target.z + camR*Math.sin(camPhi)*Math.cos(camTheta));
  camera.lookAt(target);
}
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899bb, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(5,12,7); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10});
scene.add(sun);

const L = c => new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,mat,x=0,y=0,z=0,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), typeof mat==="number"?L(mat):mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function cyl(r,h,mat,x=0,y=0,z=0,parent=scene,seg=16){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg), typeof mat==="number"?L(mat):mat);
  m.position.set(x,y,z); m.castShadow = true; parent.add(m); return m;
}
function canvasTex(w,h,draw){
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h; draw(cv.getContext("2d"));
  const t=new THREE.CanvasTexture(cv); t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter; return t;
}

// floor (studs-like tiles)
const floorTex = canvasTex(64,64,g=>{g.fillStyle="#eef1f5";g.fillRect(0,0,64,64);g.fillStyle="#e1e6ee";g.fillRect(0,0,32,32);g.fillRect(32,32,32,32);});
floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping; floorTex.repeat.set(12,8);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(24,16), new THREE.MeshLambertMaterial({map:floorTex}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
// back wall
// transparent (glass-like) wall so the area behind it stays visible
const glassMat = new THREE.MeshPhongMaterial({color:0xcfe6ff, transparent:true, opacity:0.18, shininess:100, depthWrite:false, side:THREE.DoubleSide});
const wall = box(24,5,0.3,glassMat,0,2.5,-1.5); wall.castShadow = false; wall.receiveShadow = false;
const wallEdge = new THREE.LineSegments(new THREE.EdgesGeometry(wall.geometry), new THREE.LineBasicMaterial({color:0x8fb3d9, transparent:true, opacity:0.7}));
wallEdge.position.copy(wall.position); scene.add(wallEdge);
const frameMat = new THREE.MeshLambertMaterial({color:0x9bb3d4, transparent:true, opacity:0.55});
for (let x=-12; x<=12; x+=3) { const f = box(0.08,5,0.32,frameMat,x,2.5,-1.5); f.castShadow = false; }
box(24,0.3,0.32,frameMat,0,0.15,-1.35).castShadow = false;

// ---------- tween engine ----------
let tweens = [];
function tween(dur, fn){ return new Promise(res=>tweens.push({t:0, dur, fn, res})); }
const wait = d => tween(d, ()=>{});
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

async function walkTo(key, rid){ const p = ST[key]; return walkToPt(p.x, p.z, p.f, rid); }
async function walkToPt(px, pz, pf, rid){
  const p = {x:px, z:pz, f:pf}; const sx=nurse.position.x, sz=nurse.position.z;
  const dx=p.x-sx, dz=p.z-sz, dist=Math.hypot(dx,dz);
  if (dist < 0.01) { await turnTo(p.f); return; }
  await turnTo(Math.atan2(dx,dz));
  if (rid!==runId) return;
  await tween(dist/2.6, t=>{
    nurse.position.x = sx+dx*t; nurse.position.z = sz+dz*t;
    const sw = Math.sin(t*dist*4.2)*0.6;
    legL.rotation.x = sw; legR.rotation.x = -sw; armL.p.rotation.x = -sw*0.8; armR.p.rotation.x = sw*0.8;
    nurse.position.y = Math.abs(Math.sin(t*dist*4.2))*0.06;
    updateHUD(S);
  });
  resetPose();
  if (rid!==runId) return;
  await turnTo(p.f);
}
async function turnTo(f){
  let a0 = nurse.rotation.y, d = f - a0;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  if (Math.abs(d) < 0.01) { nurse.rotation.y = f; return; }
  await tween(0.25, t=>{ nurse.rotation.y = a0 + d*ease(t); });
}

const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();
let closeUp = true, homeCam = null;
function camTo(th, ph, r, tx, ty, tz, dur){
  const a = {th:camTheta, ph:camPhi, r:camR, x:target.x, y:target.y, z:target.z};
  let dth = Math.atan2(Math.sin(th-a.th), Math.cos(th-a.th));
  return tween(dur, t=>{ const e=ease(t);
    camTheta=a.th+dth*e; camPhi=a.ph+(ph-a.ph)*e; camR=a.r+(r-a.r)*e;
    target.set(a.x+(tx-a.x)*e, a.y+(ty-a.y)*e, a.z+(tz-a.z)*e); placeCam(); });
}
async function focusPump(pm){
  if (!closeUp) return;
  homeCam = homeCam || {th:camTheta, ph:camPhi, r:camR, x:target.x, y:target.y, z:target.z};
  const pp = pm.g.getWorldPosition(new THREE.Vector3());
  let dx = pp.x-nurse.position.x, dz = pp.z-nurse.position.z; const d = Math.hypot(dx,dz); dx/=d; dz/=d;
  let px = dz, pz = -dx; if (pz < 0) { px=-px; pz=-pz; }
  const cx = px + dx*0.3, cz = pz + dz*0.3;
  await camTo(Math.atan2(cx,cz), 1.02, 7.8, (pp.x+nurse.position.x)/2, 1.35, (pp.z+nurse.position.z)/2, 0.6);
}
async function unfocus(){
  if (!homeCam) return; const h = homeCam; homeCam = null;
  await camTo(h.th, h.ph, h.r, h.x, h.y, h.z, 0.6);
}
function say(){ bubbleText = ""; bubbleEl.style.display = "none"; }
async function actHH(s, rid){
  const badge = document.getElementById("badge");
  document.getElementById("badgeChips").innerHTML = chipHTML(s.m);
  badge.classList.add("on");
  const pm = PUMPS[s.at], home = ST[s.at];
  pm.g.getWorldPosition(tmpV);
  // step up to the dispenser if it is out of reach
  let dx = nurse.position.x - tmpV.x, dz = nurse.position.z - tmpV.z, d = Math.hypot(dx,dz);
  const moved = d > 1.05;
  if (moved) { say("손소독제 쪽으로"); await walkToPt(tmpV.x + dx/d*0.95, tmpV.z + dz/d*0.95, Math.atan2(-dx,-dz), rid); }
  else await turnTo(Math.atan2(-dx,-dz));
  if (rid!==runId) return;
  hhRing.position.x = nurse.position.x; hhRing.position.z = nurse.position.z;
  await focusPump(pm);
  if (rid!==runId) return;

  // 1) left hand on pump, right hand cupped under nozzle
  say("① 왼손으로 펌프 누르기");
  await tween(0.45, t=>{ const e=ease(t);
    armL.p.rotation.set(-1.3*e, 0, 0.55*e);
    armR.p.rotation.set(-0.95*e, 0, -0.5*e);
    hhRing.material.opacity = 0.8*e; });
  if (rid!==runId) return;
  for (let i=0;i<2;i++){
    await tween(0.22, t=>{ pm.head.position.y = 0.5 - 0.07*Math.sin(t*Math.PI); armL.p.rotation.x = -1.3 + 0.12*Math.sin(t*Math.PI); });
    // gel drop falls into the right palm
    pm.tip.getWorldPosition(tmpV); armR.hand.getWorldPosition(tmpV2); tmpV2.y += 0.15;
    drop.position.copy(tmpV); drop.visible = true;
    await tween(0.3, t=>{ drop.position.lerpVectors(tmpV, tmpV2, t); drop.scale.setScalar(1 - 0.3*t); });
    drop.visible = false; drop.scale.setScalar(1);
    if (rid!==runId) return;
  }
  // 2) rub
  say("② 손바닥·손등·손가락 사이 문지르기");
  let lastB = 0;
  await tween(2.4, t=>{
    const k = Math.min(1, t*8);
    const phase = Math.floor(t*3);                 // palm-to-palm, backs, fingers
    const w = Math.sin(t*46)*0.25;
    armL.p.rotation.set(-1.15, w + (phase===1?0.15:0), 0.42 + (phase===2?Math.sin(t*30)*0.08:0));
    armR.p.rotation.set(-1.15 + (phase===1?0.12:0), w, -0.42);
    hhRing.scale.setScalar(1+0.15*Math.sin(t*12));
    if (t - lastB > 0.04 && k>0.5){ lastB = t; armR.hand.getWorldPosition(hp); hp.lerp(armL.hand.getWorldPosition(tmpV2), .5); spawnBubble(hp); }
  });
  if (rid!==runId) return;
  say("③ 완전히 마를 때까지");
  await tween(0.7, t=>{ const e=1-ease(t);
    armL.p.rotation.set(-1.15*e, Math.sin(t*20)*0.15*e, 0.42*e);
    armR.p.rotation.set(-1.15*e, -Math.sin(t*20)*0.15*e, -0.42*e);
    hhRing.material.opacity = 0.8*e; });
  hhRing.material.opacity = 0;
  resetPose();
  if (rid===runId) await unfocus();
  if (moved && rid===runId) { say("손위생 완료"); await walkTo(s.at, rid); }
  badge.classList.remove("on");
}
async function actWash(s, rid){
  const badge = document.getElementById("badge");
  document.getElementById("badgeChips").innerHTML = chipHTML(s.m);
  badge.classList.add("on"); say();
  hhRing.position.x = nurse.position.x; hhRing.position.z = nurse.position.z;
  if (closeUp){ homeCam = homeCam || {th:camTheta, ph:camPhi, r:camR, x:target.x, y:target.y, z:target.z};
    await camTo(1.15, 0.78, 6.6, -3.88, 1.05, -0.55, 0.6); }
  if (rid!==runId) return;
  // reach lever, water on
  await tween(0.4, t=>{ const e=ease(t); armR.p.rotation.set(-1.05*e,0,-0.2*e); hhRing.material.opacity=0.8*e; });
  water.visible = true;
  await tween(0.3, t=>{ armR.p.rotation.x = -1.05 + 0.15*Math.sin(t*Math.PI); });
  // wet + soap + scrub under the faucet
  let lastB = 0;
  await tween(3.0, t=>{
    const k = Math.min(1, t*6), w = Math.sin(t*50)*0.25;
    armL.p.rotation.set(-0.95*k, w, 0.42*k); armR.p.rotation.set(-0.95*k, w, -0.42*k);
    hhRing.scale.setScalar(1+0.15*Math.sin(t*12));
    water.scale.x = water.scale.z = 1 + 0.15*Math.sin(t*40);
    if (t - lastB > 0.035 && k>0.5){ lastB = t; armR.hand.getWorldPosition(hp); hp.lerp(armL.hand.getWorldPosition(tmpV2), .5); spawnBubble(hp); }
  });
  if (rid!==runId) return;
  // rinse then water off
  await tween(0.8, t=>{ const w = Math.sin(t*30)*0.15; armL.p.rotation.set(-0.9, w, 0.3); armR.p.rotation.set(-0.9, -w, -0.3); });
  water.visible = false;
  await tween(0.6, t=>{ const e=1-ease(t); armL.p.rotation.set(-0.9*e,0,0.3*e); armR.p.rotation.set(-0.9*e,0,-0.3*e); hhRing.material.opacity=0.8*e; });
  hhRing.material.opacity = 0; resetPose();
  if (rid===runId) await unfocus();
  badge.classList.remove("on");
}
async function actPPE(s){
  let swapped = false;
  await tween(1.1, t=>{
    const k = Math.sin(t*Math.PI);
    armL.p.rotation.set(-0.4*k, 0, -1.2*k); armR.p.rotation.set(-0.4*k, 0, 1.2*k);
    nurse.position.y = Math.abs(Math.sin(t*Math.PI*2))*0.12;
    if (!swapped && t>0.5){ swapped = true; const tmp={...S}; effect(tmp,s);
      gownT.visible = armL.g.visible = armR.g.visible = tmp.gown;
      armL.hand.material.color.setHex(GLOVE[tmp.glove]); armR.hand.material.color.setHex(GLOVE[tmp.glove]);
      updateHUD(tmp); }
  });
}
async function actDoor(s){
  const from = S.door?1:0, to = s.door?1:0;
  await tween(0.35, t=>{ armL.p.rotation.x = armR.p.rotation.x = -1.3*ease(t); });
  await tween(0.6, t=>setDoors(from+(to-from)*ease(t)));
  await tween(0.3, t=>{ armL.p.rotation.x = armR.p.rotation.x = -1.3*(1-ease(t)); });
}
async function actReach(s, low){
  if (s.prop) props[s.prop].visible = true;
  const ang = low ? -1.05 : -1.35;
  await tween(0.4, t=>{ armL.p.rotation.x = armR.p.rotation.x = ang*ease(t); });
  if (s.hold==="diaper") diaperB.visible = false;
  await tween(1.5, t=>{
    const w = Math.sin(t*18)*0.12;
    armL.p.rotation.x = ang + w; armR.p.rotation.x = ang - w;
    if (!low) baby.rotation.y = Math.sin(t*10)*0.04;
  });
  baby.rotation.y = 0;
  if (s.hold) props[s.hold].visible = true;
  if (s.prop && s.prop!==s.hold) props[s.prop].visible = false;
  await tween(0.35, t=>{ armL.p.rotation.x = armR.p.rotation.x = ang*(1-ease(t)); });
}
async function actWeigh(){
  await tween(0.4, t=>{ armR.p.rotation.x = -1.1*ease(t); });
  props.diaper.visible = false;
  looseDiaper.position.set(6.0,1.1,2.2); looseDiaper.visible = true;
  await tween(0.3, t=>{ armR.p.rotation.x = -1.1*(1-ease(t)); });
  for (const txt of ["…","17 g","35 g","42 g"]) { drawScale(txt); await wait(0.3); }
  await wait(0.6);
  await tween(0.4, t=>{ armR.p.rotation.x = -1.1*ease(t); });
  looseDiaper.visible = false; props.diaper.visible = true; drawScale("0 g");
  await tween(0.3, t=>{ armR.p.rotation.x = -1.1*(1-ease(t)); });
}
async function actDispose(){
  await tween(0.4, t=>{ armR.p.rotation.x = -1.2*ease(t); });
  props.diaper.visible = false;
  const p0 = new THREE.Vector3(2.3,1.4,1.85);
  looseDiaper.visible = true;
  await tween(0.45, t=>{ looseDiaper.position.set(p0.x+0.15*t, p0.y - 0.9*t*t, p0.z); looseDiaper.rotation.z = t*2; });
  looseDiaper.visible = false; looseDiaper.rotation.z = 0;
  await tween(0.3, t=>{ armR.p.rotation.x = -1.2*(1-ease(t)); });
}

async function playStep(i, rid){
  const s = CASES[caseIdx].steps[i];
  markList();
  showBubble(s);
  if (Math.hypot(nurse.position.x-ST[s.at].x, nurse.position.z-ST[s.at].z) > 0.05) await walkTo(s.at, rid);
  else await turnTo(ST[s.at].f);
  if (rid!==runId) return false;
  if (s.act==="hh" && s.wash) await actWash(s, rid);
  else if (s.act==="hh") await actHH(s, rid);
  else if (s.act==="ppe") await actPPE(s);
  else if (s.act==="door") await actDoor(s);
  else if (s.act==="reach") await actReach(s,false);
  else if (s.act==="work") await actReach(s,true);
  else if (s.act==="weigh") await actWeigh(s);
  else if (s.act==="dispose") await actDispose(s);
  if (rid!==runId) return false;
  effect(S, s); applyVisual(S);
  return true;
}
async function run(rid){
  const steps = CASES[caseIdx].steps;
  while (rid===runId && cur < steps.length) {
    const ok = await playStep(cur, rid);
    if (!ok || rid!==runId) return;
    if (!playing) { cur++; markList(); bubbleText = ""; return; }
    await wait(0.5);
    if (rid!==runId) return;
    cur++;
  }
  if (rid===runId) { markList(); bubbleText = "끝! 처음부터 다시 볼까요?"; bubbleEl.style.display="block"; bubbleEl.textContent = bubbleText; if (playing){ await wait(2.5); if (rid===runId){ jump(0); } } }
}
function jump(i, animate=true){
  runId++; tweens = [];
  if (homeCam) { camTheta=homeCam.th; camPhi=homeCam.ph; camR=homeCam.r; target.set(homeCam.x,homeCam.y,homeCam.z); homeCam=null; placeCam(); }
  water.visible = false; drop.visible = false; [pumpInc,pumpTbl,pumpMed].forEach(pm=>pm.head.position.y=0.5);
  bubbles.forEach(b=>scene.remove(b.m)); bubbles.length = 0;
  document.getElementById("badge").classList.remove("on"); hhRing.material.opacity = 0;
  const steps = CASES[caseIdx].steps;
  cur = Math.max(0, Math.min(i, steps.length));
  S = initState(); for (let k=0;k<cur;k++) effect(S, steps[k]);
  applyVisual(S);
  markList();
  if (animate && cur < steps.length) run(runId);
  else showBubble(null);
}

// ---------- UI ----------
let bubbleText = "";
function showBubble(s){
  if (!s) { bubbleText = ""; bubbleEl.style.display = "none"; return; }
  bubbleText = s.act==="hh" ? "손위생 시작!" : s.t;
  bubbleEl.textContent = bubbleText; bubbleEl.style.display = "block";
}
const tabsEl = document.getElementById("tabs");
tabsEl.innerHTML = CASES.map((c,i)=>`<button class="tab" role="tab" type="button" data-i="${i}" aria-selected="${i===0}">${c.no}. ${c.title}</button>`).join("");
tabsEl.addEventListener("click", e=>{ const b=e.target.closest(".tab"); if(!b) return; selectCase(+b.dataset.i); });
const stepsEl = document.getElementById("steps");
function renderList(){
  const c = CASES[caseIdx];
  document.getElementById("caseTitle").textContent = `CASE ${c.no} · ${c.title}`;
  const n = c.steps.filter(s=>s.act==="hh").length;
  document.getElementById("caseMeta").textContent = `${c.steps.length-n}단계 · 손위생 ${n}회`;
  const note = document.getElementById("caseNote"); note.hidden = !c.note; note.textContent = c.note||"";
  stepsEl.innerHTML = c.steps.map((s,i)=>{
    const z = inZone(s.at);
    return `<li class="${s.act==="hh"?"hh":""}" data-i="${i}"><button type="button" data-i="${i}"><span class="num">${i+1}</span><span class="stxt">
      <span>${s.act==="hh"?(s.wash?"<strong>손위생</strong> · 세면대 물과 비누":"<strong>손위생</strong>"):s.t}</span>
      ${s.m?`<span class="chips">${chipHTML(s.m)}</span>`:""}
      ${s.warn?`<span class="warn">* ${s.warn}</span>`:""}
      <span class="zt ${z?"":"out"}">${z?"신생아영역 내":"신생아영역 밖"}</span></span></button></li>`;
  }).join("");
}
stepsEl.addEventListener("click", e=>{ const b=e.target.closest("button[data-i]"); if(!b) return; jump(+b.dataset.i); });
function markList(){
  const steps = CASES[caseIdx].steps;
  stepsEl.querySelectorAll("li").forEach(li=>{ const i=+li.dataset.i; li.classList.toggle("cur", i===cur); li.classList.toggle("done", i<cur); });
  const curLi = stepsEl.querySelector("li.cur");
  if (curLi) { const r = curLi.offsetTop - stepsEl.offsetTop; if (r < stepsEl.scrollTop || r > stepsEl.scrollTop + stepsEl.clientHeight - 60) stepsEl.scrollTop = r - 40; }
  document.getElementById("bar").style.width = (100*Math.min(cur+ (cur<steps.length?0.5:0), steps.length)/steps.length) + "%";
}
function selectCase(i){
  caseIdx = i;
  tabsEl.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", String(+b.dataset.i===i)));
  renderList();
  jump(0, playing);
}
const playBtn = document.getElementById("play");
function setPlaying(p){ playing = p; playBtn.textContent = p ? "❚❚ 일시정지" : "▶ 재생"; }
playBtn.addEventListener("click", ()=>{
  setPlaying(!playing);
  if (playing) { const steps = CASES[caseIdx].steps; jump(cur >= steps.length ? 0 : cur); }
});
document.getElementById("next").addEventListener("click", ()=>{ setPlaying(false); const n=CASES[caseIdx].steps.length; jump(Math.min(cur+ (tweens.length?1:0), n-1)); });
document.getElementById("prev").addEventListener("click", ()=>{ setPlaying(false); jump(Math.max(cur-1,0)); });
document.getElementById("restart").addEventListener("click", ()=>{ setPlaying(true); jump(0); });
document.querySelectorAll(".speed button").forEach(b=>b.addEventListener("click", ()=>{
  speed = +b.dataset.s; document.querySelectorAll(".speed button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
}));

// camera drag / zoom
let drag = null;
canvas.addEventListener("pointerdown", e=>{ homeCam=null; drag={x:e.clientX,y:e.clientY,t:camTheta,p:camPhi}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", e=>{ if(!drag) return; camTheta = drag.t - (e.clientX-drag.x)*0.006; camPhi = Math.max(0.35, Math.min(1.42, drag.p - (e.clientY-drag.y)*0.005)); placeCam(); });
canvas.addEventListener("pointerup", ()=>drag=null);
canvas.addEventListener("wheel", e=>{ e.preventDefault(); camR = Math.max(7, Math.min(24, camR + e.deltaY*0.01)); placeCam(); }, {passive:false});

function resize(){
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height;
  if (!homeCam) camR = r.width < 600 ? 19 : 15;
  camera.updateProjectionMatrix(); placeCam();
}
window.addEventListener("resize", resize);

// ---------- loop ----------
let last = performance.now();
const headPos = new THREE.Vector3();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  const list = tweens; tweens = [];
  for (const tw of list){ tw.t += dt*speed; const k = Math.min(1, tw.t/tw.dur); tw.fn(k); if (k>=1) tw.res(); else tweens.push(tw); }
  for (let i=bubbles.length-1;i>=0;i--){ const b=bubbles[i]; b.life-=dt; b.m.position.y += b.vy*dt; b.m.material.opacity = Math.max(0,b.life/1.2)*0.85; if(b.life<=0){scene.remove(b.m); bubbles.splice(i,1);} }
  renderer.render(scene, camera);
  for (const l of LABELS){ const s=toScreen(l.p); l.el.style.left=s.x+"px"; l.el.style.top=s.y+"px"; l.el.style.display=s.vis?"block":"none"; }
  if (bubbleEl.style.display !== "none"){ headPos.set(nurse.position.x, 3.25, nurse.position.z); const s=toScreen(headPos); bubbleEl.style.left=s.x+"px"; bubbleEl.style.top=s.y+"px"; }
  requestAnimationFrame(frame);
}
resize();
renderList();
S = initState(); applyVisual(S);
jump(0, true);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
